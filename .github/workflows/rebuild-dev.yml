name: Rebuild dev from main

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  rebuild-dev:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reset dev to main
        run: |
          git push --force origin main:dev
